[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-eval-suite"
version = "0.1.0"
description = "Slide-level and patch-level evaluation metrics for computational pathology models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhishek Thakur", email = "a.thakur5690@gmail.com"}]
requires-python = ">=3.9"
keywords = ["digital-pathology", "evaluation", "AUC", "calibration", "whole-slide-image"]
dependencies = [
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
